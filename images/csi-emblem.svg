<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <filter id="csi-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Outer Ring -->
  <circle cx="100" cy="100" r="88" fill="none" stroke="#ffffff" stroke-width="12"/>
  
  <!-- Left Top Triangle (pointing left) -->
  <path d="M 36 94 L 94 36 L 94 94 Z" fill="#ffffff" stroke="#ffffff" stroke-width="6" stroke-linejoin="round"/>
  
  <!-- Left Bottom Triangle (pointing left) -->
  <path d="M 36 106 L 94 106 L 94 164 Z" fill="#ffffff" stroke="#ffffff" stroke-width="6" stroke-linejoin="round"/>
  
  <!-- Right Top Triangle -->
  <path d="M 106 36 L 164 36 L 106 94 Z" fill="#ffffff" stroke="#ffffff" stroke-width="6" stroke-linejoin="round"/>
  
  <!-- Right Bottom Triangle -->
  <path d="M 106 106 L 164 164 L 106 164 Z" fill="#ffffff" stroke="#ffffff" stroke-width="6" stroke-linejoin="round"/>
</svg>